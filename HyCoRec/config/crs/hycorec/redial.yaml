# dataset
dataset: ReDial
tokenize: nltk
# dataloader
related_truncate: 1024
context_truncate: 256
response_truncate: 30
scale: 1
# model
model: HyCoRec
token_emb_dim: 300
kg_emb_dim: 128
num_bases: 8
n_heads: 2
n_layers: 2
ffn_size: 300
dropout: 0.1
attention_dropout: 0.0
relu_dropout: 0.1
learn_positional_embeddings: false
embeddings_scale: true
reduction: false
n_positions: 1024
user_proj_dim: 512
# HyCoRec-CHANGE
mha_n_heads: 4
pooling: Mean
extension_strategy: Adaptive
# optim
rec:
  epoch: 1
  batch_size: 256
  early_stop: False
  stop_mode: min
  impatience: 2
  optimizer:
    name: Adam
    lr: !!float 1e-3
  # pretrain settings
  pretrain_epochs: 10
  pretrain_model_path: null
  pretrain_model_name: null
  # example pretrain_model_path: "./pretrain_models/hycorec_ReDial_pretrain.pth"
  save_pretrain_model: true
  pretrain_save_path: "./pretrain_models"
  # ViewLearner settings
  use_counterfactual: true
  view_lr: !!float 1e-2
  view_wd: !!float 1e-3
  view_alpha: 0.5
  view_lambda: 5.0
  model_lambda: 0.1
  gamma: 0.5
  temperature: 1.0
conv:
  epoch: 1
  batch_size: 128
  impatience: 1
  optimizer:
    name: Adam
    lr: !!float 1e-3
  lr_scheduler:
    name: ReduceLROnPlateau
    patience: 3
    factor: 0.5
  gradient_clip: 0.1
