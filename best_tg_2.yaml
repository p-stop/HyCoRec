# dataset
dataset: TGReDial
tokenize: pkuseg
# dataloader
related_truncate: 1024
context_truncate: 256
response_truncate: 30
scale: 1
# model
model: HyCoRec
token_emb_dim: 300
kg_emb_dim: 384
num_bases: 8
n_heads: 2
n_layers: 2
ffn_size: 300
dropout: 0.1
attention_dropout: 0.1
relu_dropout: 0.1
learn_positional_embeddings: false
embeddings_scale: true
reduction: false
n_positions: 1024
user_proj_dim: 512
# HyCoRec-CHANGE
mha_n_heads: 4
pooling: Attn
extension_strategy: Adaptive
# optim
rec:
  epoch: 50
  batch_size: 64
  early_stop: True
  early_stop_metric: recall@10
  stop_mode: max
  impatience: 3
  optimizer:
    name: Adam
    lr: !!float 0.0005174018612001967
view:
  # ===== 预训练配置 =====
  pretrain_epochs: 2            ##!!       # 预训练轮数
  pretrain_model_path: null              # 预训练模型路径，设置后跳过预训练直接加载
  # pretrain_model_path: "./pretrain_models/256kg_dim 2e.pth"  # 示例：加载已有模型
  pretrain_model_name: "256kg_dim,ffn_512,2e"              # custom pretrain filename, e.g. "epoch_2" or "epoch_2.pth"
  save_pretrain_model: false           # 预训练后是否保存模型55
  pretrain_save_path: "./pretrain_models"  # 预训练模型保存目录
  # ===== ViewLearner 配置 =====
  use_counterfactual: true        ##!!       # 是否使用反事实训练
  f_mode: 2                             # factual loss 版本选择
  cf_mode: 3                            # counterfactual loss 版本选择
  view_hidden_dim : 64              # ViewLearner 隐藏层维度
  temprature: 0.3                       # gumbel softmax 温度
  same_view: false               ##!!       # 是否使用同一视图进行事实和反事实训练
  more_train: false              # 预训练后继续训练主模型（不使用反事实训练）
  view_lr: !!float 0.0027046099266564154                 # ViewLearner 学习
  view_wd: !!float 0.0000020750554688455177                 # ViewLearner 权重衰减
  view_alpha: 0.2330031276341561                       # factual vs counterfactual 权重
  view_lambda: 0.07044029978017197                    # 边权重正则化系数
  model_lambda: 0.26924301957711977                   # 主模型对比损失权重
  hyperedge_aggregation : 'attention'  # 超边聚合方式，'attention' 或 'mean'
  topk : 1250
  neg_k: 1250
conv:
  epoch: 50
  batch_size: 64
  early_stop: True
  early_stop_metric: ppl   # 或 valid_loss（取决于你们 evaluator 里 metric 的名字）
  stop_mode: min
  impatience: 4
  optimizer:
    name: Adam
    lr: !!float 3e-4
  lr_scheduler:
    name: ReduceLROnPlateau
    patience: 2
    factor: 0.5
  gradient_clip: 0.5
